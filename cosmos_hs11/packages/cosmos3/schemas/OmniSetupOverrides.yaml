# If set, measures and reports inference runtime (disables tqdm).
benchmark: false
cfgp_size: 0
# Directory for caching S3 checkpoints.
checkpoint_cache_dir: null
# Hugging Face checkpoint directory.
checkpoint_hf: null
# Checkpoint type.
checkpoint_type: null
# Compile with symbolic-shape kernels (maps to ``torch.compile(dynamic=...)``).
#
# Defaults to ``True`` for backward compatibility with training, which can
# see varying shapes across batches.  Setting to ``False`` produces faster
# kernels when the shapes are stable (e.g. single-prompt AR inference), at
# the cost of a recompile on shape change.
compile_dynamic: true
compiled_region: all
# Hydra config store module, Hydra config yaml file, or Hugging Face model json file.
config_file: cosmos_framework/configs/base/config.py
# Hydra config file type.
config_file_type: null
cp_size: 0
# Path to S3 credentials file for remote checkpoint loading.
credential_path: credentials/gcp_checkpoint.secret
# If True, enable debug outputs.
debug: false
# Fraction of device memory to use for model weights.
#
# Used for automatic sharding.
device_memory_utilization: 0.75
# Enable the diffusion-time inference cache.
# Shared inference setup disables the cache by default. The inference CLI enables
# it by default; pass ``--no-diffusion-cache`` to disable it. Caching is based on
# SeaCache: Spectral-Evolution-Aware Cache for Accelerating Diffusion Models
# (https://arxiv.org/abs/2602.18993). Autoregressive and KV-cache generation
# bypass the cache automatically.
diffusion_cache: false
# Maximum consecutive residual reuses per CFG pathway before forcing a full
# evaluation. ``0`` disables the limit and ``None`` uses the cache default (2).
# Only used when diffusion cache is enabled.
diffusion_cache_max_consecutive_cached: null
# Polynomial order for extrapolating the generation residual on a skipped step via
# Newton divided differences: 0 = constant reuse, 1 = linear, 2 = quadratic.
# ``None`` uses the default (1).  Only used when diffusion cache is enabled.
diffusion_cache_residual_order: null
# Accumulated relative-L1 threshold (``diffusion_cache_thresh``), shared by the
# conditional and unconditional pathways. Larger values allow more skipping at
# the cost of lower fidelity. ``None`` uses the ``DiffusionCache.Config`` default
# (0.25). Only takes effect when diffusion cache is enabled.
diffusion_cache_thresh: null
dp_replicate_size: 0
dp_shard_size: 0
# Hydra experiment name.
experiment: ''
# Hydra experiment overrides.
experiment_overrides: []
# Enable guardrails.
guardrails: true
# If True, catch and log errors instead of raising them.
keep_going: false
# Maximum total tokens per batch.  When set, samples are packed into
# batches by token count.
max_model_len: null
# Maximum number of sequences per batch.  When set, samples are packed into
# batches by number of sequences.
max_num_seqs: 1
# ModelOpt FP8 checkpoints only: run the first N diffusion steps with 16-bit
# activations (W8A16) instead of FP8 activations (W8A8). 0 disables.
mixed_precision_first_steps: 0
# ModelOpt FP8 checkpoints only: run the last N diffusion steps with W8A16.
mixed_precision_last_steps: 0
# Understanding-pathway precision when mixed precision is enabled:
# high_precision keeps reasoner linears on W8A16 for every step.
mixed_precision_reasoner_policy: high_precision
# W8A16 dense-weight source: none (default) dequantizes per call and works
# everywhere, including FSDP-sharded runs, at wall time indistinguishable from
# the cached modes; generation/all hold resident BF16 caches; gpu_block/
# cpu_block stream per-layer double buffers. FSDP-sharded runs support only
# none.
mixed_precision_w8a16_cache: none
# Approximate model size in bytes.
model_memory_bytes: null
model_size: null
# Number of benchmark generations to run after warmup.
num_iterations: 1
# Offload guardrail models to CPU.
offload_guardrail_models: false
# Output directory.
output_dir: null
# Preset for automatic sharding.
parallelism_preset: latency
# Run profiler and save report to output directory.
profile: false
# Regexes matched against module FQNs; a Linear is skipped if it matches any.
quantization_exclude_regex: []
# Regexes matched against module FQNs; a Linear is quantized only if it matches one (empty = all).
quantization_include_regex:
- language_model.model.layers
# Quantization method (``mxfp8`` / ``nvfp4``), or ``None`` to disable.
#
# Post-training quantization (PTQ) is applied in-place to the model at load
# time. Only supported on Blackwell architectures and when FSDP sharding is disabled.
quantization_method: null
sample_overrides:
  # Number of action steps to predict.
  action_chunk_size: null
  # Path to action JSON file. Required for forward_dynamics mode.
  action_path: null
  # Vision aspect ratio. When None, image_edit preserves the input image's native
  # aspect ratio; all other modes default to 16:9.
  aspect_ratio: null
  # Blur control-hint overrides; set to activate the blur transfer hint.
  blur: null
  # Latent frame indices to condition on. Defaults to [0] for image, [0, 1] for video.
  condition_frame_indexes_vision: null
  # Whether to take the first or last ``max_frames`` of the conditioning
  # video when it is longer than needed. Defaults to ``"first"``. No effect
  # on image conditioning.
  condition_video_keep: null
  # Control-CFG scale for transfer. The control map stays in the main forward; 1.0 disables
  # the extra comparison forward that drops control-map vision items. Values > 1.0 blend
  # velocities from with-maps vs without-maps forwards on the generated clip.
  control_guidance: null
  # Timestep interval [lo, hi] (0–1000) in which control-CFG is applied; None applies
  # on every step.
  control_guidance_interval: null
  # Path to a JSON file of per-modality default sample fields. Overrides the built-in defaults.
  defaults_file: null
  # Depth control-hint overrides; set to activate the depth transfer hint.
  depth: null
  # If True, sample from the logits; otherwise greedy decode.
  do_sample: null
  # Action domain name passed to get_domain_id().
  domain_name: null
  # Template string for appending duration/fps to prompt. Use {duration} and {fps} placeholders.
  duration_template: null
  # Edge (Canny) control-hint overrides; set to activate the edge transfer hint.
  edge: null
  # If True (default), auto-append a one-sentence directive to the user prompt that
  # names the active control modality (e.g. "Follow the edge control video precisely.
  # ..."). Set False for clean baselines / ablations. The system prompt is unchanged.
  emphasize_control_in_prompt: null
  # Enable joint video+sound generation (t2vs mode). Requires a checkpoint with sound modules.
  enable_sound: null
  # Extra arguments.
  extra: null
  # Vision frames per second. Recommended range [10, 30]; quality may be degraded outside of this range.
  fps: null
  # Guidance scale for the diffusion model.
  guidance: null
  # Guidance interval for the diffusion model.
  guidance_interval: null
  # Quality of the saved image (0-100).
  image_save_quality: null
  # Target image height in pixels (aspect-ratio-preserving resize).
  image_size: null
  # Inverse template for duration/fps metadata in the negative prompt.
  inverse_duration_template: null
  # Inverse template for resolution metadata in the negative prompt.
  inverse_resolution_template: null
  # Maximum number of frames to generate across all chunks.
  max_frames: null
  # Maximum number of new tokens to generate per prompt.
  max_new_tokens: null
  # Model name.
  model: null
  # Generation modality. When omitted, the VFM modality is inferred from ``vision_path`` and
  # ``num_frames``; action modes must be set explicitly.
  model_mode: null
  # Name of the sample.
  name: null
  # Negative prompt metadata mode: 'none', 'same', or 'inverse'.
  negative_metadata_mode: null
  # Negative prompt - describing what you don't want in the generated video.
  negative_prompt: null
  # JSON negative caption file for transfer specs (absolute path or filename under ``defaults/``).
  negative_prompt_file: null
  # Compatibility flag. If True and mode is 'none', mode is promoted to 'same'.
  negative_prompt_keep_metadata: null
  # If True, normalize the CFG output.
  normalize_cfg: null
  # Number of conditioning frames carried into each generated chunk.
  num_conditional_frames: null
  # Number of conditioning frames for the first chunk (defaults to ``num_conditional_frames``).
  num_first_chunk_conditional_frames: null
  # Number of vision frames.
  #
  # Range by resolution: 256p: [24, 400], 480p: [24, 300], 720p/768p: [24, 200].
  # These are global limits; a checkpoint's own published range may be tighter
  # (Cosmos3-Edge is documented as 50-150 video frames).
  num_frames: null
  # Number of outputs to generate per sample.
  num_outputs: null
  # Number of steps for the diffusion model.
  num_steps: null
  # Number of video frames generated per autoregressive chunk.
  num_video_frames_per_chunk: null
  # Output directory.
  output_dir: null
  # Path to data pickle file.
  pickle_file: null
  # Additive presence penalty (any sign). ``0.0`` is identity.
  presence_penalty: null
  # Text prompt for generation. Only one of 'prompt' or 'prompt_path' should be provided.
  prompt: null
  # Path to a .txt file containing the prompt. Only one of 'prompt' or 'prompt_path' should be provided.
  prompt_path: null
  # Maximum tokens generated by the prompt upsampler.
  prompt_upsampler_max_tokens: null
  # Native prompt upsampler OpenAI-style additive presence penalty (any sign).
  prompt_upsampler_presence_penalty: null
  # Native prompt upsampler CTRL/HF-style multiplicative repetition penalty (>0).
  prompt_upsampler_repetition_penalty: null
  # Optional integer seed for the native prompt upsampler's sampling RNG.
  prompt_upsampler_seed: null
  # Native prompt upsampler sampling temperature.
  prompt_upsampler_temperature: null
  # Native prompt upsampler top-k sampling limit.
  prompt_upsampler_top_k: null
  # Native prompt upsampler nucleus sampling probability.
  prompt_upsampler_top_p: null
  # If True, replace the prompt with a dense JSON prompt.
  prompt_upsampling: null
  # Dimension of the raw action data. Required when action_path is not provided.
  raw_action_dim: null
  # CTRL/HF-style multiplicative repetition penalty (>0). ``1.0`` is identity.
  repetition_penalty: null
  # Vision resolution tier, not a pixel dimension. Resolved against
  # ``aspect_ratio`` by ``vision_size`` -- ``"256"`` at the default ``16,9``
  # yields 320x192. See docs/inference.md for the full table.
  #
  # Defaults to model config resolution.
  #
  # Accepting a value here does not mean the loaded checkpoint can generate it.
  # Per the published model cards:
  #
  # * Cosmos3-Edge: 256/480, images and video.
  # * Cosmos3-Nano: 256/480/720, images and video.
  # * Cosmos3-Super: 256/480/720; 768 additionally for images (the shipped tier
  # of the Super-Text2Image variants).
  #
  # These ranges are not enforced per checkpoint: a value outside them still
  # runs, at a tier the model was never trained on.
  resolution: null
  # Template string for appending resolution to prompt. Use {height} and {width} placeholders.
  resolution_template: null
  # Seed for the random number generator.
  seed: null
  # Segmentation control-hint overrides; set to activate the segmentation transfer hint.
  seg: null
  # Share vision temporal position ids across autoregressive chunks.
  share_vision_temporal_positions: null
  # Shift in the UniPC sampler. Ignored when sampler='edm'.
  shift: null
  # If set, include the control condition (hint map) in the saved output.
  show_control_condition: null
  # If set, include the input video alongside the generated output.
  show_input: null
  # Maximum sigma for the EDM sampler. Ignored when sampler='unipc'.
  sigma_max: null
  # Path or URL to a conditioning audio clip (e.g. .wav/.mp3/.flac). Required for
  # audio_image2video; the clip is encoded by the AVAE and used as a clean condition.
  sound_path: null
  # Sampling temperature. Ignored when ``do_sample`` is False.
  temperature: null
  # Path to data tensors file.
  tensors_file: null
  # Top-k logit truncation. Ignored when ``do_sample`` is False.
  top_k: null
  # Nucleus-sampling threshold ``0 < top_p <= 1``. Ignored when ``do_sample`` is False.
  top_p: null
  # Frames per second to sample from a video vision_path. None -> decoder default (2.0).
  video_fps: null
  # Quality of the saved video (0-10).
  video_save_quality: null
  # Viewpoint description for the action prompt.
  view_point: null
  # Path or URL to conditioning image/video.
  vision_path: null
  # World-surface-map (WSM) control-hint overrides; set to activate the WSM transfer hint.
  wsm: null
sampler: unipc
# If True, skip samples whose modality (e.g. action, sound) is not supported by the
# loaded model and emit a ``status='skip'`` output instead of raising. Useful for tests
# and examples that exercise multiple modalities against checkpoints with varying support.
skip_invalid_samples: false
tp_size: 1
use_cuda_graphs: false
# If True, use EMA weights. Otherwise, use regular weights.
use_ema_weights: true
# Whether to place pipeline vision decode on a spare local GPU when one is available.
use_separate_pipeline_vision_decode_gpu: false
# Whether to use torch compile.
use_torch_compile: true
# Discriminator.
variant: omni
# Load the VLM processor from the loaded checkpoint instead of a hardcoded repo.
vlm_processor_from_checkpoint: false
# Number of warmup generations before each sample.
warmup: 0

# LIBERO-goal few-shot (3 demos/task = 30 episodes) FULL fine-tune warm-started from a full-mode Reptile checkpoint.
# Arm v79: head-LR multiplier 1x, ranking relative weighting version (relative margin 0.3), DINOv2 REPA distillation ON.
# Fixed across the v79 family: 2 GPUs (shard 2) x 64 windows/rank, warmup 100, cycle 1000, 1000 iterations, save at 1000,
# held-out validation every 200. Structure = action_policy_libero_goal_edge_reptileinit_v41.toml (ranking) /
# action_policy_libero_10_edge_reptileinit_v105.toml (REPA). LIBERO_ROOT must point at <dir>/libero_goal.
# Env: LIBERO_ROOT, REPTILE_CKPT_PATH, META_ACTION_INIT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT, HF_HOME (DINOv2 teacher).

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge_repa"   # REPA experiment: [model.repa] is only honoured here
project      = "cosmos3_action_libero"
group        = "edge_libero_goal_fewshot"
name         = "edge_libero_goal_3ep_fullft_reptile_v79"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
lora_enabled = false            # full mode: theta lives in the DCP weights themselves, no adapters

# ---- DINOv2 ViT-B/14 REPA distillation (cosmos_hs10 v7 setting, as in action_policy_libero_10_edge_reptileinit_v105.toml);
# only honoured by experiment action_policy_libero_edge_repa (keys_to_skip_loading below also skips repa_).
[model.repa]
enabled            = true
loss_weight        = 5.0                   # unweighted 1 - cos in [0, 2]; the fm terms are x10-scaled (see hs10 docs)
layer_index        = 24                     # output of MoT block 24 (of 28)
teacher            = "dinov2_vitb14"       # facebook/dinov2-base (D=768), per frame; V-JEPA 2.1 = "vjepa2_1_vit_base_384"
teacher_input_size = 224                   # 16x16 patches of 14 px (REPA reference setting)
target_adapter     = "avgpool"             # variant 1 (parameter-free) | "avgpool_conv" (2) | "strided_conv" (3)
target_grid_thw    = [4, 5, 5]             # per-view MoT token grid (validated at runtime)

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 2      # 2-GPU run: NPROC_PER_NODE=2 sr 2 48 ...
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05          # full-FT LR of the recipe

[optimizer.lr_multipliers]
action2llm            = 1.0   # head-LR multiplier of this arm (heads are meta-initialized)
llm2action            = 1.0
action_modality_embed = 1.0

[scheduler]
cycle_lengths = [1000]        # linear decay to 0 at max_iter (matches the cosmos_hs08 baseline)
warm_up_steps = [100]

[trainer]
max_iter        = 1000
logging_iter    = 20
grad_accum_iter = 1
# held-out validation
run_validation          = true
run_validation_on_start = true   # iteration 0 = the Reptile-initialized model before any update
validation_iter         = 200
max_val_iter            = 16

[dataloader_train]
max_samples_per_batch = 64       # per rank; x 2 ranks = global batch 128
episode_subset_path   = "libero_goal_3ep_per_task_v2.json"        # 3 demos/task x 10 tasks = 30 episodes (libero_goal)

[dataloader_val]
max_samples_per_batch = 16
episode_subset_path   = "libero_goal_val_5ep_per_task_seed42_excl3ep.json"  # 5 held-out demos/task, disjoint from train (libero_goal)

[checkpoint]
load_path = "${oc.env:REPTILE_CKPT_PATH}"   # <reptile job>/checkpoints/iter_XXXXXXXXX (NOT the base Cosmos3-Edge dir)
save_iter = 1000
# The Reptile DCP has no EMA; the action heads are skipped (fresh) and then overwritten by the meta heads below.
keys_to_skip_loading = ["net_ema.", "repa_", "action2llm", "llm2action", "action_modality_embed"]   # + repa_head (absent from the Reptile DCP)
meta_action_init_path                   = "${oc.env:META_ACTION_INIT_PATH}"
meta_action_init_domain_id              = 5      # EMBODIMENT_TO_DOMAIN_ID["libero"]
meta_action_init_include_modality_embed = true
meta_action_init_include_lora           = false  # full mode: no adapters
meta_action_init_include_time_embedder  = false  # already in the DCP weights

# "ranking relative weighting version": relative margin 0.3 (E_neg >= (1 + margin) * E_pos), original gradient, no self-pacing.
[model.language_ranking]
enabled = true
loss_weight = 1.0
margin = 0.3      # absolute: E_neg >= E_pos + margin | relative: E_neg >= (1 + margin) * E_pos
# --- cosmos_hs11 v24-family loss knobs (all routed to model.config.language_ranking.*; defaults = original hinge) ---
negative_grad_scale = 1.0        # gradient scale through E_neg: 1.0 = original, 0.0 = positive-only, 0.2 = asymmetric
margin_mode         = "relative"   # "absolute" | "relative" (margin x sg(E_pos) per sample)
self_paced_fraction = 0.0        # 0.0 = off; else only this fraction of valid samples (largest detached gap - margin_i) is ranked

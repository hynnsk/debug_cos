# cosmos_hs11 -- MID-TRAINED Cosmos3-Edge INIT -> FULL fine-tune on RoboCasa365 target/atomic (18 tasks, PandaOmron),
# 50 demos/task = the RoboCasa365 paper's 10 % target split.
# The "Target only" setting of RoboCasa365 Table 2 (no RoboCasa pretrain-split exposure): the fresh-init BASELINE of
# action_policy_robocasa_edge_reptileinit_10pct.toml; experiment action_policy_robocasa_edge = the LIBERO Edge full-FT recipe on the RoboCasa 15D arm-first raw-base
# contract [eef_pos(3), eef_rot6d(6), gripper(1), base_motion(4), control_mode(1)] (dims 0..9 = the 10D LIBERO / Reptile
# meta-training layout), left|wrist 256x512 + EEF state token, chunk 16.
# Same trainable set, LR, schedule, batch, EMA and held-out validation as the reptileinit recipe; the ONLY differences are
#   * the init: [checkpoint].load_path = the base Cosmos3-Edge DCP, no meta_action_init_*; keys_to_skip_loading stays at the
#     experiment default, so the RoboCasa action-head row (30) starts fresh;
#   * the action-head LR multiplier: 5x fresh-head boost (the reptileinit recipe uses 1x, its heads are meta-initialized).
# 4 GPUs (shard 4) x 128 windows (max_samples_per_batch) = global batch 512 x 16 actions, warmup 200, linear decay to 0 at
# 3000 iterations (the same step budget for every data fraction, as in the paper), held-out val (5 demos/task) every 500.
# Env: ROBOCASA_ROOT (<ROBOCASA_DATA>/v30/target/atomic), BASE_CHECKPOINT_PATH (Cosmos3-Edge DCP dir), WAN_VAE_PATH,
# IMAGINAIRE_OUTPUT_ROOT. See docs/action_policy_robocasa_posttrain.md.

[job]
task         = "vfm"
experiment   = "action_policy_robocasa_edge"
project      = "cosmos3_action_robocasa"
group        = "edge_robocasa365_atomic"
name         = "edge_robocasa365_atomic_10pct_fullft_baseinit_v4"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056   # inert at train time (only the cost model reads it): the loader packs by max_samples_per_batch, max_sequence_length = null
lora_enabled = false                   # full fine-tune, no adapters

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 4      # 4-GPU run: NPROC_PER_NODE=4 sr 4 48 ... (global batch = 128 windows/rank x 4 ranks = 512)
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[model.rectified_flow_training_config]
action_loss_weight = 10.0   # 10 (recipe default, calibrated for NORMALISED actions in the Cosmos 3 report) -> 100: the un-normalised 15D RoboCasa
                             # actions have ~10x smaller per-element MSE (5 constant dims, near-identity rot6d), so at 10 the action term is only
                             # ~9 % of the objective vs the vision term; 100 restores ~50/50 (see docs/action_policy_robocasa_posttrain.md)

[optimizer]
lr = 2.0e-05          # full-FT LR of the recipe

[optimizer.lr_multipliers]
action2llm            = 5.0   # fresh-head boost (= the experiment default); 1x in the reptileinit recipe
llm2action            = 5.0
action_modality_embed = 5.0

[scheduler]
cycle_lengths = [100000]        # linear decay to 0 at max_iter
warm_up_steps = [200]

[trainer]
max_iter        = 5000
logging_iter    = 20
grad_accum_iter = 1              # global 512 = 128 windows/rank x 4 ranks
# held-out validation: the seeded 1 % val split (5 demos/task = 90 episodes), same windows every pass
run_validation          = true
run_validation_on_start = true   # iteration 0 = the initial model before any update
validation_iter         = 500
max_val_iter            = 16     # x 16 windows/rank x 4 ranks = 1024 windows per pass

[dataloader_train]
max_samples_per_batch = 128       # per rank, binding (token packing off): x 4 ranks = 512 windows/step; measured ~1.9k tokens/window, peak 29 GB/GPU
episodes_per_task     = 50                         # 50 demos/task = the RoboCasa365 paper's 10 % target split
use_image_augmentation = true                     # DROID-recipe augmentation (= GR00T N1.5 RoboCasa365 transform): random crop 95 % + resize + ColorJitter 0.3/0.4/0.5/0.08, train loader only

[dataloader_val]
max_samples_per_batch = 16

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"   # mid-trained Cosmos3-Edge DCP dir (NOT a Reptile iteration dir)
save_iter = 500                                # a full-mode DCP is ~24 GB; 3 per run -- raise to 3000 to keep only the final one
# No keys_to_skip_loading / meta_action_init_* here on purpose: the experiment default skips the action heads of the base
# DCP (fresh RoboCasa row), which is what the 5x head LR multiplier above is for.

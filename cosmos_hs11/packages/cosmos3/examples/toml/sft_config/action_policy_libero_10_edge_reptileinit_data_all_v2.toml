# cosmos_hs11 -- REPTILE INIT -> FULL fine-tune. LIBERO-10 few-shot post-training (3 demos/task = 30 episodes) with the
# ORIGINAL Cosmos3 recipe (experiment action_policy_libero_edge), warm-started from a full-mode Reptile checkpoint:
#   [checkpoint].load_path       = REPTILE_CKPT_PATH  (<reptile job>/checkpoints/iter_XXXXXXXXX -- the dir holding model/)
#                                  -> moe_gen, time_embedder, vae2llm, llm2vae, k_norm_und_for_gen come from theta
#   [checkpoint].meta_action_init_path = META_ACTION_INIT_PATH (<reptile job>/meta_action_init_iter_XXXXXX.pt)
#                                  -> the meta action heads are copied from the scratch row into the LIBERO row (5)
# Same trainable set, LR, schedule, batch and validation as the full-FT baseline (cosmos_hs08 / hs09); differences to the
# fresh baseline: the init, and the action-head LR multiplier (5x fresh-head boost -> 1x, the heads are meta-initialized).
# 4 GPUs (shard 4) x 64 windows = global batch 256, warmup 200, cycle 2000, 2000 iterations, held-out val every 200.
# Env: LIBERO_ROOT, REPTILE_CKPT_PATH, META_ACTION_INIT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT. See docs/action_reptile_meta.md.
#
# ---- data_all variant (2026-09-29): the SAME recipe on the WHOLE LIBERO-10 dataset, no validation -------------------
# Question: does the Reptile init still help when data is plentiful, not only in the 3-demo regime? Two changes only:
#   * [dataloader_train].episode_subset_path = "libero_10_all_episodes.json" = ALL 379 episodes (29-49 per task). It is
#     listed as a fixed subset on purpose: with the key omitted the dataset would carve out its own seeded 1 % val split
#     (val_ratio=0.01 -> 4 episodes never trained on); a fixed subset disables that, so nothing is held out.
#   * validation is OFF (run_validation=false, no val loader section): every episode is in the training set, so a val
#     loss would be in-sample and the 50-episode held-out set of the 3-demo recipes no longer exists. Pick checkpoints
#     by iteration (save_iter) and judge by LIBERO rollout success only.
# Compare against the same two changes on the fresh-init baseline (cosmos_hs08 action_policy_libero_10_edge.toml) to
# isolate the init effect. Schedule is deliberately kept identical (2000 iterations x 256 windows, warmup 200, lr 5e-5):
# 30 demos = ~67 epochs over ~7.6k windows, 379 episodes = ~5 epochs over ~95k windows. For a longer full-data schedule
# raise trainer.max_iter AND scheduler.cycle_lengths together (e.g. 6000 / [6000]), in the baseline recipe too.
[job]
task         = "vfm"
experiment   = "action_policy_libero_edge"
project      = "cosmos3_action_libero"
group        = "edge_libero10_alldata"
name         = "edge_libero10_all379_fullft_reptileinit_v4_v2"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
lora_enabled = false            # full mode: theta lives in the DCP weights themselves, no adapters

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 8      # 4-GPU run: NPROC_PER_NODE=4 sr 4 48 ...
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05          # full-FT LR of the recipe

[optimizer.lr_multipliers]
action2llm            = 2.0   # 5x in the fresh-head baseline; heads are meta-initialized here -> 1x
llm2action            = 2.0
action_modality_embed = 2.0

[scheduler]
cycle_lengths = [2000]        # linear decay to 0 at max_iter (matches the cosmos_hs08 baseline)
warm_up_steps = [200]

[trainer]
max_iter        = 2000
logging_iter    = 20
grad_accum_iter = 2              # global 256 = 64 windows/rank x 4 ranks (2-GPU alternative: shard 2, bs 64, accum 2)
run_validation          = false  # data_all: every episode is trained on -> no held-out set, no validation
run_validation_on_start = false

[dataloader_train]
max_samples_per_batch = 128       # per rank; x 4 ranks = global batch 256
episode_subset_path   = "libero_10_all_episodes.json"                # data_all: ALL 379 episodes (fixed subset -> no seeded val carve-out)

[checkpoint]
load_path = "${oc.env:REPTILE_CKPT_PATH}"   # <reptile job>/checkpoints/iter_XXXXXXXXX (NOT the base Cosmos3-Edge dir)
save_iter = 2000
# The Reptile DCP has no EMA; the action heads are skipped (fresh) and then overwritten by the meta heads below.
keys_to_skip_loading = ["net_ema.", "action2llm", "llm2action", "action_modality_embed"]
meta_action_init_path                   = "${oc.env:META_ACTION_INIT_PATH}"
meta_action_init_domain_id              = 5      # EMBODIMENT_TO_DOMAIN_ID["libero"]
meta_action_init_include_modality_embed = true
meta_action_init_include_lora           = false  # full mode: no adapters
meta_action_init_include_time_embedder  = false  # already in the DCP weights

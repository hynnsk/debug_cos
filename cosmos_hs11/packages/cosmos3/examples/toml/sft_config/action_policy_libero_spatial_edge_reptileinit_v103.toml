# v103 = the fresh-head Reptile-init recipe of this suite with the OPTIMIZATION matched to openpi's LIBERO 3ep recipe
# (libero*_3ep_*.toml, cosmos_hs11 2026-11-03): AdamW betas (0.9, 0.95) eps 1e-8, weight decay 1e-10, cosine decay
# 5e-5 -> 5e-6 after a 200-step warmup, 5000 iterations, global batch 64 (2 GPUs x 32 windows), fixed EMA decay 0.999.
# The 17-frame window, the loss weights, the 5x head LR, validation and everything else stay the Cosmos3 recipe.
# v94 = v38 with FRESH action heads (no meta_action_init; backbone = Reptile theta), head LR x5 like the baseline.

# cosmos_hs11 -- REPTILE INIT -> FULL fine-tune. LIBERO-Spatial (libero_spatial suite) few-shot post-training (3 demos/task = 30 episodes) with the
# ORIGINAL Cosmos3 recipe (experiment action_policy_libero_edge), warm-started from a full-mode Reptile checkpoint:
#   [checkpoint].load_path       = REPTILE_CKPT_PATH  (<reptile job>/checkpoints/iter_XXXXXXXXX -- the dir holding model/)
#                                  -> moe_gen, time_embedder, vae2llm, llm2vae, k_norm_und_for_gen come from theta
#   [checkpoint].meta_action_init_path = META_ACTION_INIT_PATH (<reptile job>/meta_action_init_iter_XXXXXX.pt)
#                                  -> the meta action heads are copied from the scratch row into the LIBERO row (5)
# Same trainable set, LR, schedule, batch and validation as the full-FT baseline (cosmos_hs08 / hs09); differences to the
# fresh baseline: the init, and the action-head LR multiplier (5x fresh-head boost -> 1x, the heads are meta-initialized).
# 4 GPUs (shard 4) x 64 windows = global batch 256, warmup 200, cycle 2000, 2000 iterations, held-out val every 200.
# Suite variant of action_policy_libero_10_edge_reptileinit_v3.toml: same recipe, LIBERO_ROOT must point at <dir>/libero_spatial
# and the fixed train/val episode subsets are the libero_spatial_* jsons (make_libero_episode_subset, seed 42).
# Env: LIBERO_ROOT (=<dir>/libero_spatial), REPTILE_CKPT_PATH, META_ACTION_INIT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT. See docs/action_reptile_meta.md.

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge"
project      = "cosmos3_action_libero"
group        = "edge_libero_spatial_fewshot"
name         = "edge_libero_spatial_3ep_fullft_reptile_v103"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
lora_enabled = false            # full mode: theta lives in the DCP weights themselves, no adapters

[model.ema]
enabled         = true
beta            = 0.999   # openpi ema_decay: ema = 0.999 * ema + 0.001 * w (fixed; replaces the EDM2 power schedule)
rate            = 0.1     # unused while beta is set
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 2      # 2-GPU run: NPROC_PER_NODE=2 sr 2 48 ...  (2 ranks x 32 windows = global batch 64)
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr           = 5.0e-05       # full-FT LR of the recipe (= openpi peak_lr)
betas        = [0.9, 0.95]   # openpi AdamW b1/b2 (Cosmos default [0.9, 0.99])
eps          = 1.0e-08       # openpi AdamW eps
weight_decay = 1.0e-10       # openpi weight_decay (Cosmos default 0.05)

[optimizer.lr_multipliers]
action2llm            = 5.0   # 5x in the fresh-head baseline; heads are meta-initialized here -> 1x
llm2action            = 5.0
action_modality_embed = 5.0

[scheduler]
lr_scheduler_type = "LambdaCosine"   # openpi CosineDecaySchedule (the experiment default is LambdaLinear)
cycle_lengths     = [5000]           # = max_iter: one warmup -> cosine cycle
warm_up_steps     = [200]            # openpi warmup_steps
f_start           = [0.0]            # warmup from 0
f_max             = [1.0]            # peak = lr
f_min             = [0.1]            # lr x 0.1 = 5e-6 at the last step (openpi decay_lr)

[trainer]
max_iter        = 5000           # openpi num_train_steps
logging_iter    = 20
grad_accum_iter = 1              # global 64 = 32 windows/rank x 2 ranks (openpi batch_size 64)
# held-out validation
run_validation          = true
run_validation_on_start = true   # iteration 0 = the Reptile-initialized model before any update
validation_iter         = 200
max_val_iter            = 16     # x 32 windows x 2 ranks = 1024 windows of the 50-episode val set (same windows every time)

[dataloader_train]
max_samples_per_batch = 32        # per rank; x 2 ranks = global batch 64 (openpi batch_size); a window is still 17 frames + 16 actions
episode_subset_path   = "libero_spatial_3ep_per_task_v3.json"        # 3 demos/task x 10 tasks = 30 episodes (libero_spatial)

[dataloader_val]
max_samples_per_batch = 16
episode_subset_path   = "libero_spatial_val_5ep_per_task_seed42_excl3ep.json"  # 5 held-out demos/task, disjoint from train (libero_spatial)

[checkpoint]
load_path = "${oc.env:REPTILE_CKPT_PATH}"   # <reptile job>/checkpoints/iter_XXXXXXXXX (NOT the base Cosmos3-Edge dir)
save_iter = 1000
# v94: the Reptile DCP has no EMA; the action heads (action2llm / llm2action / action_modality_embed) are skipped and
# stay FRESH (trunc-normal / zero bias, exactly like the baseline) -- no meta_action_init_* here on purpose; head LR x5 as in the baseline.
keys_to_skip_loading = ["net_ema.", "action2llm", "llm2action", "action_modality_embed"]

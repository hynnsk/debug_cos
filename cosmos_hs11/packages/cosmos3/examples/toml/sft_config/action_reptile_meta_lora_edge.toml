# cosmos_hs11 -- REPTILE meta-training, LoRA mode.
# Experiment: action_reptile_meta_edge; entry point: cosmos_framework.scripts.train_action_reptile.
# theta = LoRA(r32, alpha 64 on *_moe_gen q/k/v/o + mlp up/down) + action heads + time_embedder (38M) == the trainable
# set of the LoRA post-training recipe (action_policy_libero_lora_edge). Each meta-iteration: one embodiment, K=8 demos, k=20 FusedAdam
# steps at the downstream LoRA LR (1e-4) from theta, then theta <- theta + eps * (theta_tilde - theta).
# 4 GPUs (FSDP shard 4, fp32 master weights). ~3 min / meta-iteration -> 1000 iterations ~ 45-50 h.
# Output: <IMAGINAIRE_OUTPUT_ROOT>/cosmos3_action_meta/reptile_meta/<name>/checkpoints/iter_XXXXXXXXX (DCP = theta)
#         + meta_action_init[_iter_XXXXXX].pt (action heads for the LIBERO domain row). Downstream:
#         cosmos_hs09 LoRA recipes unchanged: action_policy_libero_10_lora_edge_metainit.toml (LoRA post-train) or
#         action_policy_libero_10_edge_metainit.toml (full-FT with the meta LoRA frozen), META_ACTION_INIT_PATH = the .pt here.
# Env: ROBOT_FEWSHOT_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT. See docs/action_reptile_meta.md.

[job]
task         = "vfm"
experiment   = "action_reptile_meta_edge"
project      = "cosmos3_action_meta"
group        = "reptile_meta"
name         = "edge_reptile_lora_r32_k8w16_s20_eps0.5_seed42"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
lora_enabled        = true
lora_rank           = 32
lora_alpha          = 64
lora_target_modules = "q_proj_moe_gen,k_proj_moe_gen,v_proj_moe_gen,o_proj_moe_gen,mlp_moe_gen.up_proj,mlp_moe_gen.down_proj"
lora_freeze_base    = false    # LoRA + heads + time_embedder train together; keys_to_select selects

[model.parallelism]
data_parallel_shard_degree     = 4    # 4-GPU run: NPROC_PER_NODE=4 sr 4 48 ...
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

# ---- INNER optimizer = the downstream full-FT optimizer (FusedAdam) ----------------------------------------------
[optimizer]
lr             = 1.0e-04      # downstream LoRA LR (action_policy_libero_lora_edge)
weight_decay   = 0.0
keys_to_select = ["lora_", "action2llm", "llm2action", "action_modality_embed", "time_embedder"]

[optimizer.lr_multipliers]
action2llm            = 1.0   # heads are meta-learned across episodes, not fresh per episode -> no 5x boost
llm2action            = 1.0
action_modality_embed = 1.0

[trainer]
max_iter     = 1000           # meta-iterations. eps anneals to meta_lr * meta_lr_min_ratio AT max_iter -> change this, do not stop early
logging_iter = 10

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 250               # DCP snapshot (~13.5 GB weights; LoRA moments are small) + meta_action_init_iter_XXXXXX.pt
keys_to_skip_loading = ["net_ema.", "lora_", "action2llm", "llm2action", "action_modality_embed"]   # base DCP has no LoRA tensors

# ---- Reptile knobs (docs/action_reptile_meta.md) --------------------------------------------------------------------
[custom.meta]
theta_mode                  = "lora"
# episodic sampler: K support demos x w windows shared by all ranks (sharded), Q query demos for diagnostics only
k_shot                = 8
q_query               = 4
windows_per_demo      = 16        # 8 x 16 = 128 support windows -> 32 per rank = one inner step = one pass over the support set
max_samples_per_batch = 32        # per-rank windows per inner step
disjoint_tasks        = "auto"
num_workers           = 4
loader_timeout_s      = 1800
seed                  = 42
# inner loop: k standard optimizer steps from theta (~20 passes over the K demos, a miniature of the 3-demo post-training)
inner_steps           = 20
inner_warmup_steps    = 3         # linear LR ramp; Adam restarts from an empty state every episode
inner_grad_clip       = 1.0
inner_reset_optimizer = true
# outer loop: theta <- theta + eps * (theta_tilde - theta); eps 0.5 -> 0.05 linearly over max_iter
meta_optimizer        = "sgd"
meta_lr               = 0.5
meta_lr_min_ratio     = 0.1
meta_lr_warmup_iters  = 0
meta_batch_embodiments = 1        # >1 averages the displacement of several embodiments per meta step (x cost)
loss_mode             = "total"   # the recipe's objective (10 x vision + 10 x action, EDGE_MODEL_CONFIG loss_scale / action_loss_weight) -- mimics post-training
scratch_domain_id     = 31
eval_query_every      = 5         # zero-shot vs adapted query loss (diagnostics; 2 extra forward passes)

# baseinit v1 = action_policy_libero_10_edge_reptileinit_v111.toml with ONLY the init changed: the mid-trained Cosmos3-Edge
# checkpoint (BASE_CHECKPOINT_PATH) instead of the Reptile theta (REPTILE_CKPT_PATH). Every other value (LR + 5x head
# multipliers, schedule, batch, EMA, validation, keys_to_skip_loading, [model.language_ranking] relative margin 0.3 /
# weight 1.0) is copied verbatim from v111.

# cosmos_hs11 -- FRESH Cosmos3-Edge INIT -> FULL fine-tune. LIBERO-10 few-shot post-training (3 demos/task = 30 episodes)
# with the ORIGINAL Cosmos3 recipe (experiment action_policy_libero_edge) + the action-language ranking hinge, started from
# the mid-trained Cosmos3-Edge checkpoint: the fresh-init BASELINE of action_policy_libero_10_edge_reptileinit_v111.toml.
#   [checkpoint].load_path = BASE_CHECKPOINT_PATH (the Cosmos3-Edge DCP dir, NOT a Reptile iteration dir); no meta_action_init_*.
#   keys_to_skip_loading = same list as v111 (net_ema + the LIBERO action heads), so the heads start fresh exactly as in v111.
# 2 GPUs (shard 2) x 128 windows = global batch 256, warmup 200, cycle 2000, 2000 iterations, held-out val every 200.
# Env: LIBERO_ROOT (=<dir>/libero_10), BASE_CHECKPOINT_PATH (Cosmos3-Edge DCP dir), WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.
# See docs/action_reptile_meta.md, section 10b.

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge"
project      = "cosmos3_action_libero"
group        = "edge_libero10_fewshot"
name         = "edge_libero10_3ep_fullft_baseinit_v1"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
lora_enabled = false            # full fine-tune, no adapters

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 2      # 2-GPU run: NPROC_PER_NODE=2 sr 2 48 ... (global batch = 128 windows/rank x 2 ranks = 256)
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05          # full-FT LR of the recipe

[optimizer.lr_multipliers]
action2llm            = 5.0   # fresh-head boost (= the experiment default), same as v111
llm2action            = 5.0
action_modality_embed = 5.0

[scheduler]
cycle_lengths = [2000]        # linear decay to 0 at max_iter (matches the cosmos_hs08 baseline)
warm_up_steps = [200]

[trainer]
max_iter        = 2000
logging_iter    = 20
grad_accum_iter = 1              # global 256 = 128 windows/rank x 2 ranks
# held-out validation (same windows as reptileinit v111)
run_validation          = true
run_validation_on_start = true   # iteration 0 = the base Cosmos3-Edge model with fresh action heads, before any update
validation_iter         = 200
max_val_iter            = 16     # x 16 windows/rank x 2 ranks = 512 windows per pass (same windows every time)

[dataloader_train]
max_samples_per_batch = 128       # per rank; x 2 ranks = global batch 256
episode_subset_path   = "libero_10_3ep_per_task_seed42.json"          # 3 demos/task x 10 tasks = 30 episodes

[dataloader_val]
max_samples_per_batch = 16
episode_subset_path   = "libero_10_val_5ep_per_task_seed42_excl3ep.json"  # 5 held-out demos/task, disjoint from train

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"   # mid-trained Cosmos3-Edge DCP dir (NOT a Reptile iteration dir)
save_iter = 2000
# Same skip list as v111: net_ema warm-starts from net, the LIBERO action heads start fresh (5x head LR above).
# On Edge this equals the experiment default (its extra "action_pos_embed" entry matches no Edge parameter).
keys_to_skip_loading = ["net_ema.", "action2llm", "llm2action", "action_modality_embed"]

# ---- action-language ranking hinge, "ranking relative weighting version": E_neg >= (1 + margin) * E_pos, weight 1.0.
[model.language_ranking]
enabled = true
loss_weight = 1.0
margin = 0.3      # absolute: E_neg >= E_pos + margin | relative: E_neg >= (1 + margin) * E_pos
negative_grad_scale = 1.0        # gradient scale through E_neg: 1.0 = original, 0.0 = positive-only, 0.2 = asymmetric
margin_mode         = "relative"   # "absolute" | "relative" (margin x sg(E_pos) per sample)
self_paced_fraction = 0.0        # 0.0 = off; else only this fraction of valid samples (largest detached gap - margin_i) is ranked

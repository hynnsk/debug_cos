# cosmos_hs11 -- REPTILE TRUNK + FRESH HEADS (ablation) -> FULL fine-tune on RoboCasa365 target/atomic (18 tasks, PandaOmron),
# 50 demos/task = the RoboCasa365 paper's 10 % target split.
# = action_policy_robocasa_edge_reptileinit_10pct.toml WITHOUT the meta action heads: the trunk (moe_gen, time_embedder,
# vae2llm, llm2vae, k_norm_und_for_gen) comes from the Reptile DCP, but the action heads of domain row 30 start fresh with
# the 5x fresh-head LR boost, exactly as in the baseinit recipe. Isolates the trunk's share of the Reptile-init effect:
#   baseinit (fresh trunk + fresh heads)  vs  this (Reptile trunk + fresh heads)  vs  reptileinit (Reptile trunk + meta heads).
# experiment action_policy_robocasa_edge = the LIBERO Edge full-FT recipe on the RoboCasa 15D arm-first raw-base
# contract [eef_pos(3), eef_rot6d(6), gripper(1), base_motion(4), control_mode(1)] (dims 0..9 = the 10D LIBERO / Reptile
# meta-training layout), left|wrist 256x512 + EEF state token, chunk 16.
# 4 GPUs (shard 4) x 128 windows (max_samples_per_batch) = global batch 512 x 16 actions, warmup 200, linear decay to 0 at
# 3000 iterations (the same step budget for every data fraction, as in the paper), held-out val (5 demos/task) every 500.
# Env: ROBOCASA_ROOT (<ROBOCASA_DATA>/v30/target/atomic), REPTILE_CKPT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.
# See docs/action_policy_robocasa_posttrain.md.

[job]
task         = "vfm"
experiment   = "action_policy_robocasa_edge"
project      = "cosmos3_action_robocasa"
group        = "edge_robocasa365_atomic"
name         = "edge_robocasa365_atomic_10pct_fullft_reptileinit_freshheads"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056   # inert at train time (only the cost model reads it): the loader packs by max_samples_per_batch, max_sequence_length = null
lora_enabled = false                   # full fine-tune, no adapters

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 2      # 4-GPU run: NPROC_PER_NODE=4 sr 4 48 ... (global batch = 128 windows/rank x 4 ranks = 512)
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05          # full-FT LR of the recipe

[optimizer.lr_multipliers]
action2llm            = 5.0   # fresh-head boost: the heads are NOT meta-initialized in this ablation (= the baseinit treatment)
llm2action            = 5.0
action_modality_embed = 5.0

[scheduler]
cycle_lengths = [3000]        # linear decay to 0 at max_iter
warm_up_steps = [200]

[trainer]
max_iter        = 3000
logging_iter    = 20
grad_accum_iter = 1              # global 512 = 128 windows/rank x 4 ranks
# held-out validation: the seeded 1 % val split (5 demos/task = 90 episodes), same windows every pass
run_validation          = true
run_validation_on_start = true   # iteration 0 = the initial model before any update
validation_iter         = 500
max_val_iter            = 16     # x 16 windows/rank x 4 ranks = 1024 windows per pass

[dataloader_train]
max_samples_per_batch = 256       # per rank, binding (token packing off): x 4 ranks = 512 windows/step; measured ~1.9k tokens/window, peak 29 GB/GPU
episodes_per_task     = 50                         # 50 demos/task = the RoboCasa365 paper's 10 % target split

[dataloader_val]
max_samples_per_batch = 16

[checkpoint]
load_path = "${oc.env:REPTILE_CKPT_PATH}"   # <reptile job>/checkpoints/iter_XXXXXXXXX (NOT the base Cosmos3-Edge dir)
save_iter = 3000                             # a full-mode DCP is ~24 GB; 3 per run -- raise to 3000 to keep only the final one
# The Reptile DCP has no EMA; the action heads are skipped and stay FRESH (no meta_action_init_* on purpose: ablation).
keys_to_skip_loading = ["net_ema.", "action2llm", "llm2action", "action_modality_embed"]

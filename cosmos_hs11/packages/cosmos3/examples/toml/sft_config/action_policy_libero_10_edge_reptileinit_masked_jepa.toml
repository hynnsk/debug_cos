# cosmos_hs11 -- REPTILE INIT -> FULL fine-tune + masked V-JEPA 2.1 feature prediction (cosmos_hs12 objective on the Reptile init).
# = action_policy_libero_10_edge_reptileinit.toml + [model.repa] (objective = masked_prediction) + "repa_" in
# keys_to_skip_loading (+ experiment/name). An auxiliary branch masks spatial tubes of the NATIVE RGB clip (40-70% of the
# 5x5 target cells per view, both views independently, frame 0 included), re-encodes the masked canvas with the frozen VAE,
# runs MoT blocks 1..8 on it (no actions / proprio / caption; packed separately, no attention to the main branch) and
# regresses the MLP-projected masked positions onto frozen V-JEPA 2.1 ViT-B/16 ema_encoder tokens of the UNMASKED future
# frames (avgpool 8x16x16 -> 4x5x5 per view, channel LayerNorm, stop-gradient):
#     loss_total = 10 * fm_vision + 10 * fm_action + lambda(step) * ( mean_masked|p - y| + 0.25 * mean_visible|p - y| )
#     lambda(step) = loss_weight * min(1, step / masked_warmup_steps)
# The main branch (original video + noised actions -> FM losses) is unchanged. New trainable params: net.repa_head.*
# (skipped at load, fresh). wandb: jepa_loss, jepa_masked_loss, jepa_visible_loss, jepa_weighted_loss, jepa_mask_fraction,
# jepa_centered_cos, jepa_pred_std, jepa_weight (+ val/ versions). Extra env: COSMOS_STORAGE (teacher
# $COSMOS_STORAGE/checkpoints/vjepa2_1/vjepa2_1_vitb_dist_vitG_384[.ema_encoder].pt). Memory: the masked branch adds a
# second VAE encode + a block-1..8 forward for up to masked_max_samples windows per rank -> expect a few GB more than the
# plain recipe; 4 x 64 should fit 44 GiB, else lower masked_max_samples.
# Docs: docs/action_reptile_meta.md section 8, docs/action_policy_libero_masked_jepa.md (design, cosmos_hs12).
#
# Base recipe: LIBERO-10 few-shot post-training (3 demos/task = 30 episodes) with the
# ORIGINAL Cosmos3 recipe (experiment action_policy_libero_edge), warm-started from a full-mode Reptile checkpoint:
#   [checkpoint].load_path       = REPTILE_CKPT_PATH  (<reptile job>/checkpoints/iter_XXXXXXXXX -- the dir holding model/)
#                                  -> moe_gen, time_embedder, vae2llm, llm2vae, k_norm_und_for_gen come from theta
#   [checkpoint].meta_action_init_path = META_ACTION_INIT_PATH (<reptile job>/meta_action_init_iter_XXXXXX.pt)
#                                  -> the meta action heads are copied from the scratch row into the LIBERO row (5)
# Same trainable set, LR, schedule, batch and validation as the full-FT baseline (cosmos_hs08 / hs09); differences to the
# fresh baseline: the init, and the action-head LR multiplier (5x fresh-head boost -> 1x, the heads are meta-initialized).
# 4 GPUs (shard 4) x 64 windows = global batch 256, warmup 200, cycle 2000, 2000 iterations, held-out val every 200.
# Env: LIBERO_ROOT, REPTILE_CKPT_PATH, META_ACTION_INIT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT. See docs/action_reptile_meta.md.

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge_repa"
project      = "cosmos3_action_libero"
group        = "edge_libero10_fewshot"
name         = "edge_libero10_3ep_fullft_reptileinit_masked_jepa_dense_l8_w0.5"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
lora_enabled = false            # full mode: theta lives in the DCP weights themselves, no adapters

# ---- cosmos_hs12: masked V-JEPA 2.1 feature prediction (hs12 dense recipe: block 8, avgpool, MLP 512, w 0.5, warmup 200)
[model.repa]
enabled         = true
loss_weight     = 0.5                      # relative to the x10-scaled FM terms; lambda ramps 0 -> 0.5 over masked_warmup_steps
layer_index     = 8                        # output of MoT block 8; next candidate 14
teacher         = "vjepa2_1_vit_base_384"  # ViT-B/16 (D=768) ema_encoder; "vjepa2_1_vit_large_384" = ViT-L/16 (D=1024)
teacher_input_size = 256                   # native LIBERO resolution == V-JEPA 2.1 RoPE base grid
target_adapter  = "avgpool"                # parameter-free (learnable adapters are not allowed for this objective)
target_grid_thw = [4, 5, 5]                # per-view MoT token grid (validated at runtime)
# Pixel-masked auxiliary branch; normal action/video FM inputs are unchanged.
objective = "masked_prediction"
projector_type = "mlp"                     # "linear" = capacity control (hs12 *_linear variant)
projector_hidden_dim = 512
masked_ratio_min = 0.4                     # fraction of 5x5 target cells masked per view (pixels masked >= this)
masked_ratio_max = 0.7
masked_visible_weight = 0.25               # weight of the context (visible) cells in the L1 regression
masked_max_samples = 16                    # windows per rank that get the auxiliary branch each step
masked_warmup_steps = 200
masked_seed = 42
center_targets = false
relation_loss_weight = 0.0
teacher_batch_size = 16

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 2      # 4-GPU run: NPROC_PER_NODE=4 sr 4 48 ...
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05          # full-FT LR of the recipe

[optimizer.lr_multipliers]
action2llm            = 1.0   # 5x in the fresh-head baseline; heads are meta-initialized here -> 1x
llm2action            = 1.0
action_modality_embed = 1.0

[scheduler]
cycle_lengths = [2000]        # linear decay to 0 at max_iter (matches the cosmos_hs08 baseline)
warm_up_steps = [200]

[trainer]
max_iter        = 2000
seed            = 42             # training RNG seed (masked_seed drives the tube masks separately)
logging_iter    = 20
grad_accum_iter = 1              # global 256 = 64 windows/rank x 4 ranks (2-GPU alternative: shard 2, bs 64, accum 2)
# held-out validation
run_validation          = true
run_validation_on_start = true   # iteration 0 = the Reptile-initialized model before any update
validation_iter         = 200
max_val_iter            = 16     # x 64 windows x 4 ranks = 4096 windows ~= half of the 50-episode val set (same windows every time)

[dataloader_train]
max_samples_per_batch = 128       # per rank; x 4 ranks = global batch 256
episode_subset_path   = "libero_10_3ep_per_task_seed42.json"          # 3 demos/task x 10 tasks = 30 episodes

[dataloader_val]
max_samples_per_batch = 16
episode_subset_path   = "libero_10_val_5ep_per_task_seed42_excl3ep.json"  # 5 held-out demos/task, disjoint from train

[checkpoint]
load_path = "${oc.env:REPTILE_CKPT_PATH}"   # <reptile job>/checkpoints/iter_XXXXXXXXX (NOT the base Cosmos3-Edge dir)
save_iter = 500
# The Reptile DCP has no EMA; the action heads are skipped (fresh) and then overwritten by the meta heads below.
keys_to_skip_loading = ["net_ema.", "repa_", "action2llm", "llm2action", "action_modality_embed"]   # + repa_head (absent from the Reptile DCP)
meta_action_init_path                   = "${oc.env:META_ACTION_INIT_PATH}"
meta_action_init_domain_id              = 5      # EMBODIMENT_TO_DOMAIN_ID["libero"]
meta_action_init_include_modality_embed = true
meta_action_init_include_lora           = false  # full mode: no adapters
meta_action_init_include_time_embedder  = false  # already in the DCP weights

# LIBERO-10 action-policy SFT run config for the `action_policy_libero_nano`
# experiment (Cosmos3-Nano base = Qwen3-VL-8B MoT).
#
# FEW-SHOT variant (cosmos_hs08): the Nano counterpart of
# action_policy_libero_10_edge.toml. Trains on the SAME fixed 30-demonstration
# subset of libero_10 (3 randomly sampled demos per task x 10 tasks, seed 42;
# episode indices frozen in
# cosmos_framework/data/generator/action/episode_subsets/libero_10_3ep_per_task_seed42.json)
# instead of all 379 demos, with the same held-out validation set, LR, schedule
# and global batch (256 windows / step) as the Edge run.
#
# Topology differs from the Edge TOML (shard 2 x 128 windows/rank) because Nano is
# ~5x larger (30 GB vs 6.3 GB bf16 DCP) and the Edge run already peaked at ~39 GB
# per 48 GB GPU: here FSDP shard 8 x 32 windows/rank = the same 256 global batch on
# one 8-GPU node (e.g. NPROC_PER_NODE=8 sr 8 48 bash examples/launch_sft_action_policy_libero_10_nano.sh).
# The upstream full-data Nano recipe (HSDP 2x8, 74000 packed tokens, selective AC,
# gbs 2048, 16000-iter cycle) is what this file replaced; remove
# [dataloader_train].episode_subset_path to train on the full suite again.
# Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH (Cosmos3-Nano DCP), WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.
# See docs/action_policy_libero_posttrain.md.

# cosmos_hs11 -- REPTILE INIT (Nano) -> FULL fine-tune. = action_policy_libero_10_nano_fewshot.toml warm-started from a Nano
# Reptile DCP (REPTILE_CKPT_PATH) with the meta action heads copied into the LIBERO row (META_ACTION_INIT_PATH); head LR
# multiplier 5x -> 1x. Everything else (shard 8 x 64 = 512, lr 5e-5, warmup 200, cycle 2000, val 200 x 16) identical.
# Env: LIBERO_ROOT, REPTILE_CKPT_PATH, META_ACTION_INIT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.

# H200 variant: 8 x 128 windows = global batch 1024 (the batch the Nano Reptile H200 recipe's inner loop is matched to).
# lr stays 5e-5 (Cosmos3 keeps it from gbs 256 to 2048); iterations / warmup / cycle unchanged (2000 / 200 / 2000).

[job]
task         = "vfm"
experiment   = "action_policy_libero_nano"
project      = "cosmos3_action_libero"
group        = "nano_libero10_fewshot"
name         = "nano_libero10_3ep_fullft_reptileinit_8gpu_bs1024_seed42_h200"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056   # Edge few-shot value (the full-data Nano recipe uses 74000)

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 8    # one 8 x 48 GB node; Nano does not fit shard 2 like Edge
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"               # Edge few-shot value; the full-data Nano recipe uses "selective"
save_ops_regex = ["fmha"]

[model.compile]
# Off on 48 GB Ampere (A40/A6000): with compile on, Inductor's fused RMSNorm-backward kernel for the
# 4096-wide Qwen3-VL-8B language region needs 114760 B of shared memory > the 101376 B hardware limit
# ("No valid triton configs ... out of resource") and the first training step dies; the forward/validation
# pass compiles fine. Edge (2048-wide) keeps compile on. Re-enable on H100-class GPUs (228 KB smem).
enabled = false

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[optimizer.lr_multipliers]
action2llm            = 1.0   # 5x in the fresh-head baseline; heads are meta-initialized here -> 1x
llm2action            = 1.0
action_modality_embed = 1.0

[scheduler]
cycle_lengths = [2000]
warm_up_steps = [200]

[trainer]
max_iter        = 2000
logging_iter    = 20
grad_accum_iter = 1               # global batch = 32 windows x 8 ranks x 1 = 256 (= Edge: 128 x 2)
# Held-out validation (50 LIBERO-10 demos disjoint from the 30 training demos; docs/action_policy_libero_posttrain.md)
# -> wandb val/loss_total, val/flow_matching_loss_action, val/flow_matching_loss_vision (+ val/loss from wandb_val).
run_validation          = true
run_validation_on_start = true   # iteration 0 = the fresh-init model before any update
validation_iter         = 200
max_val_iter            = 16     # x 32 windows x 8 ranks = 4096 windows per pass (same coverage as Edge: 16 x 128 x 2)

[dataloader_train]
max_samples_per_batch = 128      # H200: x 8 ranks = global batch 1024 (~54 GB/GPU with the EMA copy)
# Fixed few-shot subset: 3 demos/task x 10 tasks = 30 episodes (see header).
episode_subset_path = "libero_10_3ep_per_task_seed42.json"

[dataloader_val]
max_samples_per_batch = 32
episode_subset_path   = "libero_10_val_5ep_per_task_seed42_excl3ep.json"  # 5 held-out demos/task, disjoint from train

[checkpoint]
load_path = "${oc.env:REPTILE_CKPT_PATH}"   # <nano reptile job>/checkpoints/iter_XXXXXXXXX (NOT the base Cosmos3-Nano dir)
save_iter = 500
# The Reptile DCP has no EMA; the action heads are skipped (fresh) and then overwritten by the meta heads below.
keys_to_skip_loading = ["net_ema.", "action2llm", "llm2action", "action_modality_embed", "action_pos_embed"]
meta_action_init_path                   = "${oc.env:META_ACTION_INIT_PATH}"
meta_action_init_domain_id              = 5      # EMBODIMENT_TO_DOMAIN_ID["libero"]
meta_action_init_include_modality_embed = true
meta_action_init_include_lora           = false  # full mode: no adapters
meta_action_init_include_time_embedder  = false  # already in the DCP weights

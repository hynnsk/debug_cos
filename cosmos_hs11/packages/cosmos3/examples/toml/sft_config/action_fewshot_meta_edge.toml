# Cross-embodiment few-shot META-TRAINING of the Cosmos3-Edge action heads (cosmos_hs07).
# Experiment: action_fewshot_meta_edge; entry point: cosmos_framework.scripts.train_action_meta
# (NOT scripts.train). Learns one shared init theta_meta of action2llm / llm2action /
# action_modality_embed with first-order MAML over RT-1, Bridge V2, RoboMIND-UR, RoboMIND-Franka
# and MolmoAct2-YAM (embodiment-uniform, K demonstrations per support set). The backbone is frozen.
# Output: <IMAGINAIRE_OUTPUT_ROOT>/cosmos3_action_meta/fewshot_meta/<name>/meta_action_init.pt,
# consumed by action_policy_libero_10_edge_metainit.toml via checkpoint.meta_action_init_path.
# Env: ROBOT_FEWSHOT_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.
# See docs/action_fewshot_meta.md.
#
# cosmos_hs07_2 variant of the cosmos_hs07 run. Code is identical; only this TOML differs:
#   * inner optimizer SGD -> Adam. In cosmos_hs07 (SGD, inner_lr 0.05) the adaptation distance
#     ||theta_fast - theta_meta|| decayed 0.24 -> 0.05 as the support gradient shrank (an SGD step
#     is lr * grad), so by iter ~600 the adapted and zero-shot query losses were within 3% and
#     FOMAML had degenerated towards plain joint multi-task training. An Adam step is ~lr per
#     coordinate regardless of gradient magnitude, so the adaptation budget stays constant.
#   * larger meta-episodes (windows_per_demo 8 -> 16) to use the idle GPU memory
#     (cosmos_hs07 peaked at ~20 GB of 49 GB per rank).

[job]
task         = "vfm"
experiment   = "action_fewshot_meta_edge"
project      = "cosmos3_action_meta"
group        = "fewshot_meta"
name         = "edge_meta_fomaml_adam_k5q5_w16_seed42"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[trainer]
max_iter     = 2000
logging_iter = 10

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 100

# ---- meta-learning knobs (docs/action_fewshot_meta.md) -------------------------------------
[custom.meta]
# episodic sampler: K support demos x w windows, Q query demos x w windows, per meta-episode
k_shot                = 5
q_query               = 5
windows_per_demo      = 16        # 8 -> 16: 2x windows per demonstration (K-shot itself is unchanged)
disjoint_tasks        = "auto"     # support/query task sets disjoint when the embodiment has >= 4 tasks
max_samples_per_batch = 80        # = k_shot * windows_per_demo, so support/query stay ONE batch each
                                  # (if this is smaller than that product the inner steps cycle over
                                  #  sub-batches, i.e. mini-batch instead of full-batch adaptation)
num_workers           = 4
loader_timeout_s      = 1800       # a stalled DataLoader worker raises instead of hanging all ranks
seed                  = 42
# inner loop (support): Adam on fp32 fast weights of the scratch DomainAwareLinear row.
# Adam moves each coordinate by ~inner_lr per step, so adapt_delta ~ inner_lr * inner_steps * sqrt(266304)
# = inner_lr * 2580. inner_lr 1.2e-4 targets adapt_delta ~ 0.3 (cosmos_hs07 ended at 0.05).
# NOTE the scale: reusing the SGD value 0.05 here would give adapt_delta ~ 129 and diverge.
inner_steps           = 5
inner_lr              = 1.2e-4
inner_optimizer       = "adam"
inner_grad_clip       = 1.0
# outer loop (query): AdamW on theta_meta with the all-reduced first-order meta-gradient
meta_lr               = 1.0e-4
meta_grad_clip        = 1.0
meta_lr_warmup_iters  = 50
meta_lr_min_ratio     = 0.1
loss_mode             = "action"   # flow-matching action loss only (ANIL-style); "total" adds the vision loss
scratch_domain_id     = 31         # unused DomainAwareLinear row that carries the fast weights
include_modality_embed = true
init_source           = "fresh"    # fresh | checkpoint_row | checkpoint_mean | zeros
eval_zero_shot_every  = 5         # query_loss vs query_loss_zero_shot is THE health metric; 1 extra fwd

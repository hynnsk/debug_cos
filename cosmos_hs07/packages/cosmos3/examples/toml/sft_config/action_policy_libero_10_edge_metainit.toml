# LIBERO-10 few-shot post-training (3 demos/task = 30 episodes) with the META-LEARNED action-head
# initialization (cosmos_hs07 "ours"). Identical to action_policy_libero_10_edge.toml (the
# baseline: fresh action heads) except the [checkpoint].meta_action_init_* keys: after the base
# Cosmos3-Edge DCP is loaded with the action heads skipped, theta_meta from
# scripts/train_action_meta.py is copied into the LIBERO DomainAwareLinear row (domain id 5) and
# into action_modality_embed. Trainable parameters, learning rates and data are unchanged so the
# two runs differ in exactly the initialization.
# Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT,
#      META_ACTION_INIT_PATH (= <meta run dir>/meta_action_init.pt).
# See docs/action_fewshot_meta.md and docs/action_policy_libero_posttrain.md.

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge"
project      = "cosmos3_action_libero"
group        = "edge_libero10_fewshot"
name         = "edge_libero10_3ep_per_task_sft_metainit_hs07_1500_seed42"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 4
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [2000]
warm_up_steps = [500]

[trainer]
max_iter        = 2000
logging_iter    = 20
grad_accum_iter = 1

[dataloader_train]
max_samples_per_batch = 128
# Fixed few-shot subset: 3 demos/task x 10 tasks = 30 episodes.
episode_subset_path = "libero_10_3ep_per_task_seed42.json"

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
# ---- ours: meta-learned action-head initialization (baseline TOML leaves these unset) ----
meta_action_init_path      = "${oc.env:META_ACTION_INIT_PATH}"
meta_action_init_domain_id = 5      # EMBODIMENT_TO_DOMAIN_ID["libero"]
meta_action_init_include_modality_embed = true

# openpi_hs11 -- REPTILE meta pre-training of pi05_base, variant v3: LONG INNER ADAPTATION (k = 20).
# Rationale: the downstream post-training is thousands of full-FT steps, and Reptile's meta term (the part that is not plain
# joint training) grows with k(k-1): a 10-step inner loop on a 3.35 B model is almost indistinguishable from multi-task SFT.
# v3 doubles the inner horizon at the SAME total compute as v1 (20 steps x 256 windows x 500 meta-iterations), with the v2 support
# diversity fix (128 demos x 2 windows) so that the extra passes adapt rather than memorise, and the damped outer step.
# Risk to watch: with 20 passes over the support the query gap (query_loss_zero_shot - query_loss_adapted) can go negative
# earlier than in v2; if it does, this variant is memorising and v2/v5 should be preferred.
# Launch: sr 4 48 scripts/hs11/launch_reptile_pi05_v3.sh      (smoke: ... outer.max_iter=2 checkpoint.save_interval=1 wandb.enabled=false)
# Checkpoints: checkpoints/pi05_reptile/reptile_v3/<meta-iter>/params (125 / 250 / 375 / 500)

[job]
name         = "pi05_reptile"
exp_name     = "reptile_v3"
project_name = "openpi_hs11"

[wandb]
enabled = true
mode    = "offline"

[model]
action_horizon = 10            # = the downstream LIBERO recipe

[checkpoint]
init_params   = "gs://openpi-assets/checkpoints/pi05_base/params"   # cached under $OPENPI_DATA_HOME
base_dir      = "./checkpoints"
save_interval = 500            # 4 snapshots over the 500 meta-iterations
keep_period   = 500

[data]
embodiments      = ["fractal", "bridge", "robomind_ur", "robomind_franka", "molmoact2_yam"]
data_root        = ""          # "" = $ROBOT_FEWSHOT_ROOT
assets_dir       = "./assets/pi05_reptile"   # <assets_dir>/<embodiment>/norm_stats.json
num_workers      = 8
prefetch_episodes = 3

[sampler]
k_shot                 = 128   # 256 support windows from 128 distinct demos (see v2)
windows_per_demo       = 2
q_query                = 32    # 64 query windows (diagnostics only)
query_windows_per_demo = 2
disjoint_query_tasks   = true
min_tasks_for_disjoint = 4
min_frames             = 1

[inner]
steps           = 20           # v1: 10.  twice the adaptation horizon -> ~2x the per-episode displacement
batch_size      = 64           # 256 / 64 = 4 micro-batches per inner step
lr              = 5e-5
warmup_steps    = 2
weight_decay    = 1e-10
clip            = 1.0
reset_optimizer = true

[outer]
meta_lr           = 0.25       # eps 0.25 -> 0.05 over the 500 iterations (per-episode displacement is ~2x v1, so the outer step stays damped)
meta_lr_min_ratio = 0.2
max_iter          = 500        # 20 x 256 x 500 = 10 x 256 x 1000 -> same compute as v1 (~84 h on 4 x 48 GB)
eval_query_every  = 1

[infra]
seed         = 42
fsdp_devices = 0
log_interval = 1
overwrite    = false
resume       = true

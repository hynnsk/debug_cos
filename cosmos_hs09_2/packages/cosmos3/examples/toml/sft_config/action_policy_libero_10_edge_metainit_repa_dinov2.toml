# cosmos_hs09_2 -- META INIT -> FULL fine-tune + DINOv2 REPA distillation loss.
#
# = examples/toml/sft_config/action_policy_libero_10_edge_metainit.toml (cosmos_hs09: LIBERO-10 few-shot
#   post-training, 3 demos/task = 30 episodes, ORIGINAL Cosmos3 recipe with full moe_gen + time_embedder +
#   vae2llm/llm2vae + k_norm_und_for_gen + action heads trainable, initialized from the LoRA-regime theta_meta
#   of action_fewshot_meta_lora_edge: LoRA adapters (carried frozen, lr multiplier 0 == merged delta) + heads +
#   time_embedder)
# + the cosmos_hs10 v7 REPA loss (examples/toml/sft_config/action_policy_libero_10_edge_repa_v7.toml there):
#       loss_total = 10 * fm_vision + 10 * fm_action                         (unchanged)
#                  + repa.loss_weight * (1 - cos(MLP(h_8[video tokens]), avgpool(DINOv2-ViT-B/14(frames))))
#   h_8 = residual stream of the PREDICTED video tokens after MoT block 8 (of 28); teacher = frozen
#   facebook/dinov2-base applied per frame at 224 px (16x16 patches of 14 px) to frames 1..16 of each camera
#   view; the parameter-free avgpool adapter pools 16 frames -> 4 latent frames (bins of 4, exactly the Wan VAE
#   mapping) and 16x16 -> 5x5 per view; the two views are concatenated along width (4x5x10 tokens per window).
#   New trainable params: net.repa_head.* (REPA 3-layer SiLU MLP 2048->2048->2048->768; "repa_" in
#   keys_to_select). The DINOv2 teacher is NOT trained / checkpointed / sharded.
#
# The only differences to action_policy_libero_10_edge_metainit.toml: [job].experiment/group/name, the
# [model.repa] block, and "repa_" in keys_to_skip_loading (absent from the base DCP). Everything the meta init
# touches (LoRA carrier config, lr multipliers, [checkpoint].meta_action_init_*) is identical, so a comparison
# against that TOML isolates the effect of the distillation loss.
# Held-out validation (50 disjoint demos) at iteration 0 and every 200 iters -> wandb val/*: val/loss_total,
# val/flow_matching_loss_{action,vision}, val/repa_loss, val/repa_cos_sim, val/repa_cos_sim_centered, val/repa_rel_loss.
# Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT, META_ACTION_INIT_PATH,
#      HF_HOME (facebook/dinov2-base snapshot in $HF_HOME/hub; downloaded on first use if absent).
# See docs/action_fewshot_meta_lora_repa_dinov2.md (and docs/action_policy_libero_repa_vjepa.md for the REPA code).

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge_repa"
project      = "cosmos3_action_libero"
group        = "edge_libero10_fewshot"
name         = "edge_libero10_3ep_fullft_metainit_repa_dinov2b_l24_avgpool_w5.0"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
# LoRA modules exist only to CARRY theta_meta's adapters (must match the meta run: rank 32, alpha 64, same targets).
lora_enabled        = true
lora_rank           = 32
lora_alpha          = 64
lora_target_modules = "q_proj_moe_gen,k_proj_moe_gen,v_proj_moe_gen,o_proj_moe_gen,mlp_moe_gen.up_proj,mlp_moe_gen.down_proj"
lora_freeze_base    = false    # full fine-tune: the injector must not freeze moe_gen etc.; keys_to_select selects

# ---- cosmos_hs10 v7: DINOv2 ViT-B/14 REPA distillation (hs10 default setting: block 8, avgpool, MLP projector, w 5.0)
[model.repa]
enabled            = true
loss_weight        = 5.0                   # unweighted 1 - cos in [0, 2]; the fm terms are x10-scaled (see hs10 docs)
layer_index        = 24                     # output of MoT block 8 (of 28); next candidate 14
teacher            = "dinov2_vitb14"       # facebook/dinov2-base (D=768), per frame; V-JEPA 2.1 = "vjepa2_1_vit_base_384"
teacher_input_size = 224                   # 16x16 patches of 14 px (REPA reference setting)
target_adapter     = "avgpool"             # variant 1 (parameter-free) | "avgpool_conv" (2) | "strided_conv" (3)
target_grid_thw    = [4, 5, 5]             # per-view MoT token grid (validated at runtime)

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 2      # 2-GPU run: NPROC_PER_NODE=2 sr 2 48 ... (bs 128/rank -> global 256)
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05          # full-FT LR of the recipe (moe_gen 1.4B); the meta init does not change what moe_gen tolerates

# Per-module LR multipliers (substring match, first match wins; entries below override the experiment's 5x).
[optimizer.lr_multipliers]
action2llm            = 1.0   # 5x in the fresh-head baseline; heads are meta-initialized here -> 1x
llm2action            = 1.0
action_modality_embed = 1.0
lora_                 = 0.0   # freeze the meta-learned LoRA delta (== merged into moe_gen); moe_gen trains around it

[scheduler]
cycle_lengths = [2000]        # linear decay to 0 at max_iter (matches the cosmos_hs08 baseline)
warm_up_steps = [200]

[trainer]
max_iter        = 2000
logging_iter    = 20
grad_accum_iter = 1              # global 256 = 128 windows/rank x 2 ranks (the hs10 REPA runs used the same;
                                 # they sit at the 44 GiB edge -> prefer 48 GiB A6000s, see hs10 docs)
# held-out validation
run_validation          = true
run_validation_on_start = true   # iteration 0 = the meta-initialized model before any update
validation_iter         = 200
max_val_iter            = 16

[dataloader_train]
max_samples_per_batch = 128       # per rank; x 2 ranks = global batch 256
episode_subset_path   = "libero_10_3ep_per_task_seed42.json"          # 3 demos/task x 10 tasks = 30 episodes

[dataloader_val]
max_samples_per_batch = 16
episode_subset_path   = "libero_10_val_5ep_per_task_seed42_excl3ep.json"  # 5 held-out demos/task, disjoint from train

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
# Base DCP has no LoRA tensors, no REPA head, and the action heads must start fresh -> skip them at load; the meta
# init overwrites heads + LoRA + time_embedder right afterwards; repa_head keeps its fresh init.
keys_to_skip_loading = ["net_ema.", "lora_", "repa_", "action2llm", "llm2action", "action_modality_embed"]
# ---- ours: meta-learned initialization ----
meta_action_init_path                   = "${oc.env:META_ACTION_INIT_PATH}"
meta_action_init_domain_id              = 5      # EMBODIMENT_TO_DOMAIN_ID["libero"]
meta_action_init_include_modality_embed = true
meta_action_init_include_lora           = true
meta_action_init_include_time_embedder  = true

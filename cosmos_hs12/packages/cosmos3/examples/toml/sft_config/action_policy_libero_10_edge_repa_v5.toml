# LIBERO-10 few-shot (3 demos/task) action-policy post-training of the mid-trained Cosmos3-Edge
# + V-JEPA 2.1 representation alignment (REPA) on the MoT generation pathway (cosmos_hs10).
#
# Baseline recipe = cosmos_hs08 examples/toml/sft_config/action_policy_libero_10_edge.toml (2 GPUs, shard 2,
# 128 windows/rank, 1000 iters, held-out validation every 100 iters). The only additions are the [model.repa]
# block (experiment `action_policy_libero_edge_repa`) and the resulting extra loss / wandb curves
# (repa_loss = 1 - cos, val/repa_loss, val/repa_cos_sim).
#
# VARIANT v5 (VideoREPA-style TOKEN-RELATION distillation instead of direct feature alignment). Everything else is
# the base recipe: teacher ViT-B/16 (ema_encoder), MoT block 8 (of 28), target adapter variant 1 (avgpool, no
# learnable part), REPA MLP projector, 256x256 teacher input per view, 16 future frames -> 8x16x16 -> 4x5x5 per view.
#   student relation  R_s = normalize(MLP(h_k)) normalize(MLP(h_k))^T       per sample, over its 4x5x10 predicted tokens
#   teacher relation  R_t = normalize(avgpool(V-JEPA)) normalize(avgpool(V-JEPA))^T
#   repa_rel_loss     = mean_{i,j} (R_s[i,j] - R_t[i,j])^2     (200x200 map per LIBERO window; spatial + temporal pairs)
# The direct 1 - cos term is still logged (repa_loss / repa_cos_sim) but has weight 0 here. Compare against the base run.
# Other variants: *_l14.toml (block 14), *_vitl.toml (ViT-L/16), *_v2/_v3.toml (learnable adapters), *_v4.toml (linear projector).
# Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT, COSMOS_STORAGE (teacher ckpts under
# $COSMOS_STORAGE/checkpoints/vjepa2_1/). See docs/action_policy_libero_repa_vjepa.md.

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge_repa"
project      = "cosmos3_action_libero"
group        = "edge_libero10_fewshot_repa"
name         = "hs10_repa_vitb_l8_avgpool_rel_l2_w5.0"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056

[model.repa]
enabled         = true
loss_weight     = 0.0                      # direct 1 - cos alignment OFF (still logged as repa_loss / repa_cos_sim)
relation_loss_weight = 5.0                 # v5: VideoREPA-style token-relation distillation ON
relation_distance    = "l2"                # squared difference of the relation maps ("l1" = absolute)
layer_index     = 8                        # output of MoT block 8; next candidate 14
teacher         = "vjepa2_1_vit_base_384"  # ViT-B/16 (D=768); "vjepa2_1_vit_large_384" = ViT-L/16 (D=1024)
teacher_input_size = 256                   # native LIBERO resolution == V-JEPA 2.1 RoPE base grid
target_adapter  = "avgpool"                # variant 1 (parameter-free) | "avgpool_conv" (2) | "strided_conv" (3)
target_grid_thw = [4, 5, 5]                # per-view MoT token grid (validated at runtime)
projector_type  = "mlp"                    # REPA 3-layer SiLU MLP (default); "linear" = single Linear (v4)

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 2
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [2000]
warm_up_steps = [200]

[trainer]
max_iter        = 2000
logging_iter    = 20
grad_accum_iter = 1
run_validation          = true
run_validation_on_start = true
validation_iter         = 200
max_val_iter            = 16

[dataloader_train]
max_samples_per_batch = 128
episode_subset_path = "libero_10_3ep_per_task_seed42.json"

[dataloader_val]
max_samples_per_batch = 32
episode_subset_path   = "libero_10_val_5ep_per_task_seed42_excl3ep.json"

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500

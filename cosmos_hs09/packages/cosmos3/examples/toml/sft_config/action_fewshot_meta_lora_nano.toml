# cosmos_hs09 -- cross-embodiment few-shot META-TRAINING in the LoRA regime on Cosmos3-NANO (8 x H200).
# Experiment: action_fewshot_meta_lora_nano; entry point: cosmos_framework.scripts.train_action_meta.
# theta_meta = action heads + action_modality_embed + LoRA(rank 32, alpha 64) on every *_moe_gen q/k/v/o +
# mlp gate/up/down (Qwen3 SwiGLU) + time_embedder (~0.1 B params) -- exactly the trainable set the downstream Nano
# LoRA post-training must use (same rank / alpha / lora_target_modules, lora_freeze_base = false there).
# Inner loop: Adam on the fast weights; outer loop: AdamW on theta_meta with the all-reduced first-order meta-gradient;
# each of the 8 ranks runs its own meta-episode per iteration (8 episodes per outer step, 2x the 4-GPU Edge run).
#
# Sizing (the downstream post-training is 8 GPUs x 128 windows = 2048 windows/step for 2000 steps, LoRA lr 1e-4).
# FOMAML cannot mirror a 2000-step adaptation, so the inner loop is made as "downstream-like" as the memory allows:
#   * inner_lr 1.0e-4 = the downstream LoRA learning rate (Adam moves every coordinate ~lr per step, so the adaptation
#     magnitude is set by inner_steps x inner_lr, not by the batch size);
#   * inner_steps 10 (Edge used 5): adapt_delta ~2x the Edge run; 20 doubles t_inner again (see the estimate below);
#   * support = k_shot 8 demos x windows_per_demo 8 = 64 windows in ONE packed batch per inner step
#     (max_samples_per_batch = 64), query = q_query 4 x 8 = 32 windows -- 2x the Edge batch, well inside 141 GB.
#     windows_per_demo 16 + max_samples_per_batch 128 (128-window inner batch, ~45k packed tokens) also fits an H200
#     and halves the gap to the downstream batch, at ~2x the iteration time.
# Time estimate per iteration on one H200 rank (Edge on A40: 0.135 s per window fwd+bwd, VAE encode 0.43 s/window;
# Nano ~4.6x the parameters, H200 ~3.5x the A40 throughput): inner 10 x 64 x ~0.18 s ~ 115 s, query ~6 s, encode
# 96 windows ~15 s -> ~2.3 min/iter -> max_iter 1000 ~ 38 h, 2000 ~ 77 h. The outer LR anneals to meta_lr_min_ratio
# AT max_iter, so pick 1000 or 2000 here rather than stopping early. Memory per rank: 31.5 GB frozen bf16 weights +
# ~2.5 GB theta_meta/optimizer state + activations of a 64-window packed batch under full activation checkpointing.
# Output: <IMAGINAIRE_OUTPUT_ROOT>/cosmos3_action_meta/fewshot_meta_lora/<name>/meta_action_init[_iter_XXXXXX].pt
# Env: ROBOT_FEWSHOT_ROOT, BASE_CHECKPOINT_PATH (Cosmos3-Nano DCP), WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT, HF_HOME (the
# Qwen3-VL tokenizer is read from the HF cache; set HF_HUB_OFFLINE=1 on nodes without internet).
# See docs/action_fewshot_meta_lora.md (section 8).

[job]
task         = "vfm"
experiment   = "action_fewshot_meta_lora_nano"
project      = "cosmos3_action_meta"
group        = "fewshot_meta_lora"
name         = "nano_meta_lora_r32_fomaml_adam_k8q4_w8_s10_seed42"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056
# must match the downstream Nano LoRA recipe -- the meta init maps onto these adapters (Qwen3 SwiGLU: + gate_proj)
lora_enabled        = true
lora_rank           = 32
lora_alpha          = 64
lora_target_modules = "q_proj_moe_gen,k_proj_moe_gen,v_proj_moe_gen,o_proj_moe_gen,mlp_moe_gen.gate_proj,mlp_moe_gen.up_proj,mlp_moe_gen.down_proj"

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.compile]
enabled = false            # eager: the inner loop swaps fast weights in place (also mandatory on 48 GB Ampere)

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[trainer]
max_iter     = 1000       # ~2.3 min/iter estimated on 8 x H200 (see header) -> ~38 h; 2000 -> ~77 h. The outer LR
                          # anneals to meta_lr_min_ratio AT max_iter, so change this value rather than stopping early.
logging_iter = 10

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"   # Cosmos3-Nano DCP dir
save_iter = 500

# ---- meta-learning knobs (docs/action_fewshot_meta.md, docs/action_fewshot_meta_lora.md) --------------------
[custom.meta]
# episodic sampler: K support demos x w windows, Q query demos x w windows, per meta-episode (per rank)
k_shot                = 8         # support demonstrations per episode (Edge: 5)
q_query               = 4         # query demonstrations per episode (Edge: 5; 32 query windows are enough for the outer step)
windows_per_demo      = 8         # windows per demonstration; 16 (+ max_samples_per_batch 128) = 128-window inner batch
disjoint_tasks        = "auto"    # support/query task sets disjoint when the embodiment has >= 4 tasks
max_samples_per_batch = 64        # = k_shot * windows_per_demo -> support is ONE packed batch per inner step
num_workers           = 8
loader_timeout_s      = 1800
seed                  = 42
# theta_meta groups
include_modality_embed = true
include_lora           = true     # LoRA adapters (needs [model] lora_enabled)
include_time_embedder  = true
init_source            = "fresh"  # heads fresh (= baseline init); LoRA A~kaiming / B=0 and mid-trained time_embedder from the model
scratch_domain_id      = 31       # unused DomainAwareLinear row (Nano heads also have 32 rows) that carries the head fast weights
# inner loop (support): Adam on fp32 fast weights; each coordinate moves ~inner_lr per step
inner_steps           = 10        # Edge: 5. 20 = 2x t_inner again, closer to the long downstream adaptation
inner_lr              = 1.0e-4    # = the downstream Nano LoRA learning rate
inner_optimizer       = "adam"
inner_grad_clip       = 1.0
# outer loop (query): AdamW on theta_meta
meta_lr               = 1.0e-4
meta_grad_clip        = 1.0
meta_lr_warmup_iters  = 50
meta_lr_min_ratio     = 0.1
loss_mode             = "action"  # configuration A: flow-matching ACTION loss only (ANIL-style)
eval_zero_shot_every  = 5         # query_loss vs query_loss_zero_shot = the adaptation-gain metric

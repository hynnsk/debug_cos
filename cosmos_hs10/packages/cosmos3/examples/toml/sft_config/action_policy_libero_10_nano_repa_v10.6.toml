# Nano REPA v10.6: v10.5 (V-JEPA 2.1 ViT-L/16 block 23, plain token cosine) + LESS POOLING, exactly like Edge v13:
# `target_subgrid_thw = [1, 2, 2]` adapts each view to 4x10x10 teacher cells instead of 4x5x5 and every MoT token
# predicts its 2x2 spatial sub-cells with one 4*1024-wide projector output (rows [N*4, 1024]; the 8 tubelets are still
# averaged in pairs into the 4 latent frames -- temporal refinement was measured to add nothing, 0.33 -> 0.34).
# Measured on LIBERO-10 val: shared-direction energy of the target 0.62 -> 0.53, constant-prediction raw cos
# 0.79 -> 0.74, energy left after spatial centering 0.33 -> 0.42.
# NO pooling at all (each MoT token = its 2 tubelets x 3x3 raw teacher patches, 18 rows per token, identity adapter)
# is the two-line alternative below; it needs the 240 px teacher input so that 15x15 patches divide the 5x5 MoT grid:
#   teacher_input_size = 240
#   target_subgrid_thw = [2, 3, 3]
# (raw-grid target: shared-direction energy 0.36, constant-prediction cos 0.60, energy left 0.61; ~4-5x the REPA rows
# and a 2048 -> 18432 projector output, so expect a few GB more per rank than [1, 2, 2].)
# v10.5 notes: NOTE: the REPA teacher has always
# returned a single block's output (the last block through its per-level LayerNorm); it never concatenates the four
# hierarchical layers the way V-JEPA 2.1 pretraining does, so v10.2 was already block 23 -- v10.5 only makes that
# explicit (`teacher_layer_index = 23`) and drops the spatial normalization. Measured on LIBERO-10 val (2026-09-29):
# a constant prediction already scores raw cos 0.79 on this pooled 4x5x10 target (ViT-B block 11: 0.92), so watch
# repa_cos_sim_centered rather than repa_cos_sim.
#
# Cosmos3-Nano (Qwen3-VL-8B MoT, hidden 4096, 36 blocks) LIBERO-10 few-shot post-training (30 train demos
# `libero_10_3ep_per_task_seed42.json`, 50 held-out val demos, lr 5e-5, cycle 2000 / warmup 200, 256 windows/step)
# + REPA loss on the MoT generation pathway (experiment `action_policy_libero_nano_repa`, cosmos_hs10).
# Topology = the validated cosmos_hs08 Nano few-shot recipe: FSDP shard 8 x 32 windows/rank on ONE 8 x 48 GB node,
# torch.compile OFF (Inductor's fused RMSNorm-backward for the 4096-wide language region exceeds Ampere's smem),
# activation checkpointing "full". Launch: NPROC_PER_NODE=8 sr 8 48 bash examples/launch_sft_action_policy_libero_10_nano_repa_v10.sh
#
# Teacher tier: ViT-L (D=1024) to match the ~5x larger student (the Edge recipes use ViT-B). `layer_index` 10 of 36
# ~= the Edge depth 8 of 28. All [model.repa] knobs (layer, teacher, weight, objective, adapter, projector) are TOML-editable;
# schema: cosmos_framework/configs/toml_config/sft_config.py::RepaTomlConfig -> model.config.repa.*.
# Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH (Cosmos3-Nano DCP), WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT, COSMOS_STORAGE / HF_HOME
# (teacher weights). See docs/action_policy_libero_repa_vjepa.md, section 8.

[job]
task         = "vfm"
experiment   = "action_policy_libero_nano_repa"
project      = "cosmos3_action_libero"
group        = "nano_libero10_fewshot_repa"
name         = "hs10_nano_repa_v10.6_token_vjepa_vitl_blk23_l36_subgrid122_w5.0"
wandb_mode   = "online"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 45056   # Edge few-shot value (the full-data Nano recipe uses 74000)

[model.repa]
enabled            = true
loss_weight        = 5.0                       # weight of (1 - cos); fm terms carry x10, so 5.0 ~= the REPA paper's lambda 0.5
objective          = "token"                   # v10.5: plain cosine on the absolute tokens (no spatial normalization)
layer_index        = 36                        # MoT block whose residual stream is aligned (1..36); Edge used 8 of 28
teacher            = "vjepa2_1_vit_large_384"   # V-JEPA 2.1 ViT-L/16 ema_encoder (D=1024)
teacher_layer_index = 23                       # v10.5: encoder block 23 = the LAST block of ViT-L (per-level LN output); no multi-layer concat
teacher_input_size = 256                       # native LIBERO resolution == V-JEPA 2.1 RoPE base grid (240 + [2,3,3] = no pooling, see header)
target_adapter     = "avgpool"                 # variant 1 | "avgpool_conv" (2) | "strided_conv" (3)
target_grid_thw    = [4, 5, 5]                 # per-view MoT token grid (validated at runtime)
target_subgrid_thw = [1, 2, 2]                 # v10.6: 2x2 spatial teacher sub-cells per MoT token (4x10x10 per view), as Edge v13
projector_type     = "mlp"                     # REPA 3-layer SiLU MLP 4096 -> 2048 -> 2048 -> 1024; "linear" = single Linear

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = 8    # one 8 x 48 GB node; Nano does not fit shard 2 like Edge
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"               # Edge few-shot value; the full-data Nano recipe uses "selective"
save_ops_regex = ["fmha"]

[model.compile]
# Off on 48 GB Ampere (A40/A6000): with compile on, Inductor's fused RMSNorm-backward kernel for the
# 4096-wide Qwen3-VL-8B language region needs 114760 B of shared memory > the 101376 B hardware limit
# ("No valid triton configs ... out of resource") and the first training step dies. Re-enable on H100-class GPUs.
enabled = false

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [2000]
warm_up_steps = [200]

[trainer]
max_iter        = 2000
logging_iter    = 20
grad_accum_iter = 1               # global batch = 32 windows x 8 ranks x 1 = 256 (= Edge: 128 x 2)
# Held-out validation (50 LIBERO-10 demos disjoint from the 30 training demos)
# -> wandb val/loss_total, val/flow_matching_loss_{action,vision}, val/repa_loss, val/repa_cos_sim(_centered/_spatial_norm).
run_validation          = true
run_validation_on_start = true   # iteration 0 = the fresh-init model before any update
validation_iter         = 200
max_val_iter            = 16     # x 32 windows x 8 ranks = 4096 windows per pass

[dataloader_train]
max_samples_per_batch = 128
episode_subset_path = "libero_10_3ep_per_task_seed42.json"   # 3 demos/task x 10 tasks = 30 episodes

[dataloader_val]
max_samples_per_batch = 32
episode_subset_path   = "libero_10_val_5ep_per_task_seed42_excl3ep.json"  # 5 held-out demos/task, disjoint from train

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
